[workspace]
resolver = "2"
members = [
    "crates/reoo-core",
    "crates/reoo-search",
    "crates/reoo-workspace",
    "src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["cccbit"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ropey = "1.6"
memmap2 = "0.9"
encoding_rs = "0.8"
regex = "1"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
directories = "6"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
